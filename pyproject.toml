[project]
name = "kanban-tui"
version = "0.1.0"
description = "Kanban board TUI — terminal for agents, web for people (Textual + textual-serve)"
readme = "README.md"
authors = [
    { name = "John", email = "razodin137@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
    "textual-serve>=1.1.3",
]

[project.scripts]
kanban-tui = "kanban_tui.tui.app:main"
kanban = "kanban_tui.cli:main"
kanban-serve = "kanban_tui.serve:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
